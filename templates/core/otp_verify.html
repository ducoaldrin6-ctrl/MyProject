{% extends 'core/base.html' %}
{% load static %}

{% block title %}Verify OTP | Richwell Scholarship{% endblock %}

{% block content %}
<div class="auth-shell otp-shell">
    <section class="auth-panel auth-brand-panel compact">
        <div class="auth-logo-wrap">
            <img src="{% static 'images/logo.png' %}" alt="Richwell Scholarship logo" class="auth-logo">
            <div class="auth-badge">Richwell</div>
        </div>
        <h1>Verification</h1>
    </section>

    <section class="auth-panel auth-form-panel">
        <div class="auth-form-card otp-card">
            <div class="auth-form-logo mb-4">
                <img src="{% static 'images/logo.png' %}" alt="Richwell Scholarship logo">
            </div>
            <h2 class="fw-bold mb-2">Enter OTP</h2>
            <p class="auth-subtitle">We sent a 6-digit code to {{ user.email|default:'your email' }}.</p>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">OTP Code</label>
                    <input type="text" name="otp_code" class="form-control otp-input" maxlength="6" inputmode="numeric" autocomplete="one-time-code" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">Login</button>
            </form>

            <form method="post" class="mt-3">
                {% csrf_token %}
                <input type="hidden" name="action" value="resend">
                <button type="submit" class="btn btn-outline-primary w-100">Resend OTP</button>
            </form>

            <a href="{% url 'core:login' %}" class="auth-back-link">Back to login</a>
        </div>
    </section>
</div>
{% endblock %}
